<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 534" role="img" aria-labelledby="title desc">
  <title id="title">Ejemplo visual de integración API con EMIZOR</title>
  <desc id="desc">Una solicitud JSON sale de un sistema empresarial y EMIZOR genera una factura electrónica.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#071929"/><stop offset="1" stop-color="#103b62"/></linearGradient>
    <linearGradient id="emizor" x2="1" y2="1"><stop stop-color="#2996e7"/><stop offset="1" stop-color="#146bc2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="145%"><feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#001a31" flood-opacity=".34"/></filter>
  </defs>
  <rect width="800" height="534" rx="24" fill="url(#background)"/>
  <circle cx="730" cy="45" r="124" fill="#2b93e0" opacity=".12"/>
  <circle cx="66" cy="500" r="135" fill="#2b93e0" opacity=".09"/>
  <g fill="#88bfe6" opacity=".35"><circle cx="82" cy="76" r="3"/><circle cx="105" cy="76" r="3"/><circle cx="128" cy="76" r="3"/></g>
  <text x="66" y="116" fill="#dff2ff" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">Solicitud de factura</text>
  <text x="66" y="143" fill="#7fc5f4" font-family="Arial,Helvetica,sans-serif" font-size="14">API REST · JSON</text>
  <g filter="url(#shadow)">
    <rect x="52" y="165" width="422" height="285" rx="17" fill="#0b2134" stroke="#315f83"/>
    <rect x="52" y="165" width="422" height="43" rx="17" fill="#123751"/>
    <path d="M52 191h422" stroke="#315f83"/>
    <circle cx="78" cy="186" r="6" fill="#72bfed"/><circle cx="98" cy="186" r="6" fill="#4c91bd"/><circle cx="118" cy="186" r="6" fill="#316f9b"/>
    <text x="147" y="191" fill="#d7ecfb" font-family="ui-monospace,Menlo,monospace" font-size="13">POST /facturas</text>
    <g font-family="ui-monospace,Menlo,monospace" font-size="16">
      <text x="81" y="242" fill="#8bc8ef">{</text>
      <text x="102" y="274" fill="#75c5a6">&quot;cliente&quot;</text><text x="194" y="274" fill="#dfeaf2">: </text><text x="213" y="274" fill="#ffd589">&quot;Empresa&quot;</text><text x="302" y="274" fill="#dfeaf2">,</text>
      <text x="102" y="306" fill="#75c5a6">&quot;detalle&quot;</text><text x="194" y="306" fill="#dfeaf2">: </text><text x="213" y="306" fill="#ffd589">&quot;Servicio&quot;</text><text x="312" y="306" fill="#dfeaf2">,</text>
      <text x="102" y="338" fill="#75c5a6">&quot;importe&quot;</text><text x="194" y="338" fill="#dfeaf2">: </text><text x="213" y="338" fill="#b9d9ff">1250.00</text>
      <text x="81" y="370" fill="#8bc8ef">}</text>
    </g>
    <rect x="81" y="398" width="202" height="28" rx="14" fill="#153f5d"/>
    <text x="182" y="417" text-anchor="middle" fill="#a7d9f9" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">Datos para la emisión</text>
  </g>
  <path d="M491 305h63" fill="none" stroke="#69b8ec" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 12"/>
  <path d="m545 291 17 14-17 14" fill="none" stroke="#79c4f2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="573" y="103" width="177" height="194" rx="19" fill="#fff"/>
    <rect x="592" y="122" width="139" height="37" rx="8" fill="url(#emizor)"/>
    <text x="661" y="146" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">EMIZOR</text>
    <text x="593" y="186" fill="#173655" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">FACTURA ELECTRÓNICA</text>
    <path d="M593 203h137m-137 17h137m-137 17h76m-76 17h108" stroke="#b7d4e8" stroke-width="7" stroke-linecap="round"/>
    <path d="M593 271h137" stroke="#d9e8f2"/>
  </g>
  <g transform="translate(583 332)">
    <rect width="154" height="72" rx="14" fill="#15466f" stroke="#4b94c6"/>
    <path d="M24 25h24m-24 13h38m-38 13h30" stroke="#9fd7fa" stroke-width="5" stroke-linecap="round"/>
    <text x="105" y="34" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">Factura</text>
    <text x="105" y="54" text-anchor="middle" fill="#a4d9fb" font-family="Arial,Helvetica,sans-serif" font-size="12">generada</text>
  </g>
  <text x="662" y="449" text-anchor="middle" fill="#d8f0ff" font-family="Arial,Helvetica,sans-serif" font-size="15">Emisión desde tu operación</text>
</svg>
